name: Build Tauri App

on:
  push:
    branches: [ main, 'v3/**' ]
    paths: [ 'v3/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'v3/**' ]
  workflow_dispatch:

# Cancel in-progress runs when a new workflow with the same group is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: v3/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './v3/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ./v3
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./v3
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./v3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brtx-installer-v3
          path: |
            ./v3/src-tauri/target/release/bundle/
          if-no-files-found: warn
